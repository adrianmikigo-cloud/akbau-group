<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Pro - Panel Zarządzania</title>
    <style>
        :root { --neon: #0f4; --bg: #050505; --gray: #1a1a1a; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 20px; text-align: center; }
        h1 { font-size: 22px; border-bottom: 2px solid var(--neon); padding-bottom: 10px; margin-bottom: 30px; }
        
        .container { max-width: 500px; margin: 0 auto; }
        #loader { color: #555; font-style: italic; }
        
        .chat-card { 
            background: var(--gray); 
            border: 1px solid #333; 
            padding: 20px; 
            margin-bottom: 15px; 
            border-radius: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            text-decoration: none;
            color: var(--neon);
            transition: 0.2s;
        }
        
        .chat-card:active { transform: scale(0.98); background: var(--neon); color: #000; }
        .chat-info { text-align: left; }
        .chat-name { font-weight: bold; font-size: 18px; display: block; }
        .chat-meta { font-size: 10px; color: #666; }
        .status-online { width: 10px; height: 10px; background: var(--neon); border-radius: 50%; box-shadow: 0 0 8px var(--neon); }
    </style>
</head>
<body>

    <div class="container">
        <h1>STACJA BAZOWA: GHOST PRO</h1>
        <div id="loader">POBIERANIE LISTY CZATÓW...</div>
        <div id="list"></div>
    </div>

    <script>
        // --- USTAWIENIA ---
        const CONFIG = {
            token: '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', // WPISZ TUTAJ NOWY TOKEN
            user: 'adrianmikigo-cloud',
            repo: 'tajny-czat'
        };

        async function getChats() {
            try {
                const r = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/`, {
                    headers: { 'Authorization': `token ${CONFIG.token}` }
                });
                const files = await r.json();
                
                const listDiv = document.getElementById('list');
                document.getElementById('loader').style.display = 'none';

                // Sortowanie alfabetyczne (czat01, czat02...)
                files.sort((a, b) => a.name.localeCompare(b.name));

                files.forEach(f => {
                    if (f.name.toLowerCase().startsWith('czat') && f.name.endsWith('.html')) {
                        const card = document.createElement('a');
                        card.href = f.name;
                        card.className = 'chat-card';
                        
                        const name = f.name.replace('.html', '').toUpperCase();
                        
                        card.innerHTML = `
                            <div class="chat-info">
                                <span class="chat-name">📟 ${name}</span>
                                <span class="chat-meta">ADRES: /${f.name}</span>
                            </div>
                            <div class="status-online"></div>
                        `;
                        listDiv.appendChild(card);
                    }
                });

                if (listDiv.innerHTML === "") {
                    listDiv.innerHTML = "<div style='color:#555'>BRAK AKTYWNYCH CZATÓW W REPOZYTORIUM</div>";
                }

            } catch (e) {
                document.getElementById('loader').innerText = "BŁĄD POŁĄCZENIA Z SERWEREM";
                console.error(e);
            }
        }

        getChats();
    </script>
</body>
</html>
