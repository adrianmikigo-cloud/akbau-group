<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Pro - Panel Sterowania</title>
    <style>
        :root { --neon: #0f4; --bg: #050505; }
        body { background: var(--bg); color: var(--neon); font-family: 'Segoe UI', monospace; padding: 20px; text-align: center; }
        h1 { border-bottom: 2px solid var(--neon); padding-bottom: 10px; font-size: 20px; }
        
        #file-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .chat-link { 
            background: #111; 
            border: 1px solid #333; 
            color: var(--neon); 
            padding: 15px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-link:active { background: var(--neon); color: #000; }
        .status-dot { width: 10px; height: 10px; background: var(--neon); border-radius: 50%; box-shadow: 0 0 5px var(--neon); }
    </style>
</head>
<body>

    <h1>MOJE SYSTEMY CZATÓW</h1>
    <div id="loader">Skanuję repozytorium...</div>
    <div id="file-list"></div>

    <script>
        async function loadChats() {
            // WPISZ SWOJE DANE TUTAJ:
            const user = "TWÓJ_LOGIN_GITHUB";
            const repo = "TWOJA_NAZWA_REPO";

            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
                const files = await response.json();
                
                const listContainer = document.getElementById('file-list');
                document.getElementById('loader').style.display = 'none';

                files.forEach(file => {
                    // Sprawdzamy czy plik zaczyna się od "czat" i jest plikiem HTML
                    if (file.name.toLowerCase().startsWith('czat') && file.name.endsWith('.html')) {
                        const link = document.createElement('a');
                        link.href = file.name;
                        link.className = 'chat-link';
                        
                        // Ładna nazwa bez rozszerzenia .html
                        const displayName = file.name.replace('.html', '').toUpperCase();
                        
                        link.innerHTML = `
                            <span>📂 ${displayName}</span>
                            <div class="status-dot"></div>
                        `;
                        listContainer.appendChild(link);
                    }
                });

                if (listContainer.innerHTML === "") {
                    listContainer.innerHTML = "Brak plików zaczynających się od 'czat'";
                }

            } catch (error) {
                document.getElementById('loader').innerText = "Błąd ładowania listy plików.";
                console.error(error);
            }
        }

        loadChats();
    </script>
</body>
</html>
