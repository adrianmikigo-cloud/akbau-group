<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST PRO v6</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --neon: #0f4; --bg: #050505; --red: #ff4444; --dim: #041; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: monospace; background: var(--bg); color: var(--neon); margin: 0; padding: 0; height: 100vh; overflow: hidden; }

        /* --- STRONY --- */
        .page { 
            display: none; 
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 130px; 
            overflow-y: auto; 
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .active-page { display: block; }

        /* --- MENU START --- */
        #p-main { text-align: center; padding-top: 25%; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 300px; margin: 0 auto; }
        .btn-m { background: #111; border: 1px solid var(--neon); padding: 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-m.locked { border-color: var(--dim); color: var(--dim); cursor: not-allowed; }

        /* --- CZAT (Wyrównanie góra, ciasno) --- */
        #chat-container { display: flex; flex-direction: column; gap: 2px; }
        .msg { border-bottom: 1px solid #111; padding: 2px 0; font-size: 13px; line-height: 1.2; }
        .ts { color: #062; font-size: 9px; margin-right: 4px; }
        .n { font-weight: bold; color: #fff; }

        /* --- USTAW / SKANER --- */
        #reader { width: 100%; height: 180px; background: #000; border: 1px dashed var(--neon); margin-bottom: 15px; border-radius: 8px; overflow: hidden; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        input { background: #111; border: 1px solid var(--neon); color: var(--neon); padding: 12px; border-radius: 4px; font-size: 16px; width: 100%; }
        .btn-act { background: var(--neon); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 4px; width: 100%; cursor: pointer; }
        .btn-off { background: none; border: 1px solid var(--red); color: var(--red); padding: 10px; border-radius: 4px; width: 100%; margin-top: 15px; }

        /* --- DOLNE PASKI --- */
        .input-bar { 
            position: fixed; bottom: 70px; left: 0; right: 0; 
            background: #000; padding: 10px; display: flex; gap: 5px; 
            border-top: 1px solid #222; z-index: 9998; 
        }
        .nav-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            height: 70px; background: #000; display: flex; 
            border-top: 2px solid #333; z-index: 9999; 
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #444; cursor: pointer; }
        .nav-item.on { color: var(--neon); font-weight: bold; }
        .nav-item.locked { color: #111; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="p-main" class="page active-page">
        <h2 style="margin-bottom:30px;">GHOST PRO <span id="lock-status" style="font-size:10px; display:block; color:var(--red);">WYMAGANE POŁĄCZENIE</span></h2>
        <div class="grid">
            <div id="m-btn-chat" class="btn-m locked" onclick="checkGo('p-chat')">💬<br>CZAT</div>
            <div class="btn-m" onclick="goTo('p-set')">⚙️<br>USTAW</div>
        </div>
    </div>

    <div id="p-set" class="page">
        <div id="reader"></div>
        <div class="input-group">
            <input type="password" id="t" placeholder="GitHub Token">
            <input id="r" placeholder="User/Repo">
            <input type="password" id="c" placeholder="Klucz Szyfru">
            <input id="n" placeholder="Twój Nick">
            <button class="btn-act" onclick="init()">POŁĄCZ I ODBLOKUJ</button>
            <button class="btn-off" onclick="logout()">WYLOGUJ (RESET)</button>
        </div>
    </div>

    <div id="p-chat" class="page">
        <div id="chat-container"></div>
        <div style="height: 60px;"></div> 
    </div>

    <div id="chat-input-zone" class="input-bar" style="display:none;">
        <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') send()">
        <button style="background:var(--neon); border:none; padding:0 20px; font-weight:bold; border-radius:4px;" onclick="send()">OK</button>
    </div>

    <div class="nav-bar">
        <div class="nav-item on" id="n-main" onclick="goTo('p-main')">🏠<br>START</div>
        <div id="n-chat-btn" class="nav-item locked" onclick="checkGo('p-chat')">💬<br>CZAT</div>
        <div class="nav-item" id="n-set" onclick="goTo('p-set')">⚙️<br>USTAW</div>
    </div>

<script>
    let hist = "", sha = "", path = "", qr = null;
    const $ = id => document.getElementById(id);

    function checkGo(id) {
        if(!path) {
            alert("Najpierw połącz się w zakładce USTAW!");
            goTo('p-set');
        } else {
            goTo(id);
        }
    }

    function updateLockUI() {
        if(path) {
            $('m-btn-chat').classList.remove('locked');
            $('n-chat-btn').classList.remove('locked');
            $('lock-status').innerText = "SYSTEM AKTYWNY";
            $('lock-status').style.color = "var(--neon)";
        } else {
            $('m-btn-chat').classList.add('locked');
            $('n-chat-btn').classList.add('locked');
            $('lock-status').innerText = "WYMAGANE POŁĄCZENIE";
            $('lock-status').style.color = "var(--red)";
        }
    }

    function goTo(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('on'));
        $(id).classList.add('active-page');
        const navId = 'n-' + id.split('-')[1];
        if($(navId)) $(navId).classList.add('on');

        $('chat-input-zone').style.display = (id === 'p-chat') ? 'flex' : 'none';
        if(id === 'p-set') startQR(); else stopQR();
    }

    function logout() { if(confirm("Wyczyścić dane?")) { localStorage.clear(); path=""; location.reload(); } }

    function startQR() {
        if(!qr) qr = new Html5Qrcode("reader");
        qr.start({ facingMode: "environment" }, { fps: 10, qrbox: 180 }, (txt) => {
            const d = txt.split('|');
            if(d.length >= 4) {
                $('t').value = d[0]; $('r').value = d[1]; $('c').value = d[2]; $('n').value = d[3];
                init();
            }
        }).catch(e => console.log("Cam error"));
    }

    async function stopQR() { if(qr && qr.isScanning) await qr.stop(); }

    window.onload = () => {
        ['gh_t', 'gh_r', 'gh_n', 'gh_c'].forEach(k => {
            if(localStorage.getItem(k)) $(k.replace('gh_','')).value = localStorage.getItem(k);
        });
        if($('c').value && $('t').value) {
            path = "pokoje/" + CryptoJS.MD5($('c').value).toString().substring(0, 10) + ".txt";
            updateLockUI();
        }
    };

    async function init() {
        if(!$('c').value || !$('t').value) return alert("Brak danych!");
        path = "pokoje/" + CryptoJS.MD5($('c').value).toString().substring(0, 10) + ".txt";
        ['t','r','n','c'].forEach(id => localStorage.setItem('gh_'+id, $(id).value));
        updateLockUI();
        goTo('p-chat');
        setInterval(fetchData, 4000);
        fetchData();
    }

    async function fetchData() {
        if(!path) return;
        try {
            const r = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?t=${Date.now()}`, {
                headers: {'Authorization': `token ${$('t').value}`}
            });
            if(r.ok) {
                const d = await r.json(); sha = d.sha;
                const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
                if(dec && dec !== hist) {
                    $('chat-container').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                    $('p-chat').scrollTop = $('p-chat').scrollHeight;
                    hist = dec;
                }
            }
        } catch(e) {}
    }

    async function send() {
        const v = $('m').value.trim(); if(!v || !path) return;
        const entry = `<span class="ts">[${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}]</span> <span class="n">${$('n').value}:</span> ${v}`;
        const full = hist + (hist ? "\n" : "") + entry;
        const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());
        const r = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
            method: 'PUT',
            headers: {'Authorization': `token ${$('t').value}`},
            body: JSON.stringify({message: "msg", content: enc, sha: sha})
        });
        if(r.ok) { $('m').value = ""; fetchData(); }
    }
</script>
</body>
</html>
