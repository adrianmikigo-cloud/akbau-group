<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Chat PRO - Budowa V3.5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --neon-green: #0f4; --dark-bg: #050505; }
        body { font-family: 'Segoe UI', monospace; background: var(--dark-bg); color: var(--neon-green); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Ekrany */
        .screen { display: none; flex-direction: column; height: 100vh; width: 100%; position: absolute; top: 0; left: 0; }
        .active { display: flex; }

        /* Menu */
        #menu { justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center; }
        .menu-btn { background: #000; border: 2px solid var(--neon-green); color: var(--neon-green); padding: 20px; width: 100%; max-width: 300px; margin: 10px 0; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; }
        .menu-btn:active { background: var(--neon-green); color: #000; }

        /* Setup */
        #setup { padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .box { border: 2px solid var(--neon-green); padding: 15px; border-radius: 8px; background: #000; margin-top: 10px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #111; margin-bottom: 10px; border: 1px dashed var(--neon-green); }
        input { background: #111; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 12px; font-size: 16px; border-radius: 4px; width: 100%; box-sizing: border-box; margin: 5px 0; }
        
        /* Czat */
        #chat-ui { display: none; flex-direction: column; height: 100vh; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #0a1a0a; border-bottom: 1px solid #041; }
        .nav-btn { background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; }

        /* WIADOMOŚCI WYRÓWNANE DO DOŁU Z ODSTĘPEM */
        #chat-container { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; /* Pcha wiadomości w dół */
        }
        
        /* Odstęp od pola wpisywania */
        .bottom-gap { height: 85px; flex-shrink: 0; }

        .msg { border-bottom: 1px solid #111; padding: 8px 0; word-break: break-all; }
        .ts { color: #062; font-size: 10px; margin-right: 5px; }
        .n { font-weight: bold; color: #fff; }

        /* Pasek wpisywania */
        .input-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; padding: 12px; display: flex; gap: 8px; border-top: 2px solid var(--neon-green); z-index: 100; }
        .input-bar input { flex-grow: 1; margin: 0; }
        .input-bar button { width: 60px; background: var(--neon-green); color: #000; font-weight: bold; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="menu" class="screen active">
        <h1>GHOST CHAT PRO</h1>
        <p style="font-size: 10px; color: #555;">SECURITY LEVEL: MAXIMUM</p>
        <button class="menu-btn" onclick="openScanner()">[1] SKANUJ KOD QR</button>
        <button class="menu-btn" onclick="showScreen('setup')">[2] WPISZ RĘCZNIE</button>
        <button class="menu-btn" onclick="confirmExit()" style="color:#f55; border-color:#700;">[X] WYJDŹ</button>
    </div>

    <div id="setup" class="screen">
        <div class="nav-bar"><span>LOGOWANIE</span><button class="nav-btn" onclick="showScreen('menu')">WSTECZ</button></div>
        <div id="reader"></div>
        <div class="box">
            <input type="password" id="t" placeholder="GitHub Token">
            <input id="r" placeholder="User/Repo">
            <input type="password" id="c" placeholder="Klucz (Hasło)">
            <input id="n" placeholder="Twój Nick">
            <button class="menu-btn" style="width:100%;" onclick="init()">POŁĄCZ Z POKOJEM</button>
        </div>
    </div>

    <div id="chat-ui" class="screen">
        <div class="nav-bar"><span id="st">ŁĄCZENIE...</span><button class="nav-btn" onclick="confirmExit()">LOGOUT</button></div>
        <div id="chat-container">
            <div id="messages-list"></div>
            <div class="bottom-gap"></div>
        </div>
        <div class="input-bar">
            <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">OK</button>
        </div>
    </div>

<script>
    let history = "", sha = "", path = "", qrScanner;
    const $ = id => document.getElementById(id);

    // BLOKADA WYJŚCIA
    window.onbeforeunload = () => "Czy na pewno?";

    function confirmExit() {
        if(confirm("Wylogować i wyczyścić sesję?")) {
            window.location.reload();
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        $(id).classList.add('active');
        if(id !== 'setup' && qrScanner) qrScanner.stop();
    }

    function openScanner() {
        showScreen('setup');
        qrScanner = new Html5Qrcode("reader");
        qrScanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => {
            const d = txt.split('|');
            if(d.length >= 4) {
                $('t').value = d[0]; $('r').value = d[1]; $('c').value = d[2]; $('n').value = d[3];
                init();
            }
        }).catch(e => console.log("Czekam na kamerę"));
    }

    async function init() {
        if(!$('t').value || !$('c').value) return alert("Brak danych!");
        const key = $('c').value;
        path = "pokoje/" + CryptoJS.MD5(key).toString().substring(0, 10) + ".txt";
        
        if(qrScanner) try { await qrScanner.stop(); } catch(e){}

        // Zero Trace: Pamiętamy tylko dane publiczne (opcjonalnie)
        localStorage.setItem('gh_r', $('r').value);
        localStorage.setItem('gh_n', $('n').value);

        showScreen('chat-ui');
        $('st').innerText = "SYNCHRONIZACJA...";
        
        setInterval(fetchMessages, 4000);
        fetchMessages();
    }

    async function fetchMessages() {
        if(!path) return;
        try {
            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?t=${Date.now()}`, {
                headers: {'Authorization': `token ${$('t').value}`}
            });
            if (res.ok) {
                const d = await res.json();
                sha = d.sha;
                const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
                if (dec && dec !== history) {
                    $('messages-list').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                    $('chat-container').scrollTop = $('chat-container').scrollHeight;
                    history = dec;
                    $('st').innerText = "ONLINE ✅";
                }
            } else if(res.status === 404) {
                $('st').innerText = "NOWY POKÓJ - WYŚLIJ TEST";
            }
        } catch (e) { $('st').innerText = "BŁĄD POŁĄCZENIA"; }
    }

    async function send() {
        const m = $('m').value.trim();
        if(!m) return;
        const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const entry = `<span class="ts">[${time}]</span> <span class="n">${$('n').value}:</span> ${m}`;
        const full = history + (history ? "\n" : "") + entry;
        const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());

        const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
            method: 'PUT',
            headers: {'Authorization': `token ${$('t').value}`},
            body: JSON.stringify({message: "msg", content: enc, sha: sha})
        });
        if(res.ok) { 
            const d = await res.json();
            sha = d.content.sha;
            $('m').value = ""; 
            fetchMessages(); 
        }
    }

    window.onload = () => {
        if(localStorage.getItem('gh_r')) $('r').value = localStorage.getItem('gh_r');
        if(localStorage.getItem('gh_n')) $('n').value = localStorage.getItem('gh_n');
    };
</script>
</body>
</html>
