<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST PRO v3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/html5-qrcode" crossorigin="anonymous"></script>
    <style>
        :root { --neon: #0f4; --bg: #050505; --card: #111; }
        * { box-sizing: border-box; }
        body { font-family: monospace; background: var(--bg); color: var(--neon); margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Nawigacja */
        .page { display: none; height: calc(100vh - 70px); width: 100%; overflow-y: auto; padding: 15px; }
        .active { display: flex; flex-direction: column; }

        /* Menu Start */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .btn-big { background: var(--card); border: 1px solid #333; padding: 30px 10px; border-radius: 12px; text-align: center; color: var(--neon); font-weight: bold; cursor: pointer; }
        .btn-big:active { background: var(--neon); color: #000; }

        /* Skaner i Formularz */
        #reader { width: 100%; min-height: 250px; background: #000; border: 1px dashed var(--neon); margin-bottom: 15px; }
        input { background: #000; border: 1px solid var(--neon); color: var(--neon); padding: 12px; margin-bottom: 10px; border-radius: 5px; width: 100%; font-size: 16px; }
        .btn-action { background: var(--neon); color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; }

        /* Czat */
        #chat-container { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        .msg { background: #0a0a0a; border-left: 3px solid var(--neon); padding: 8px; font-size: 14px; word-break: break-all; }
        .ts { color: #062; font-size: 10px; }
        
        /* Paski boczne/dolne */
        .input-bar { position: fixed; bottom: 70px; left: 0; right: 0; background: #000; padding: 10px; display: flex; gap: 5px; border-top: 1px solid #222; z-index: 1000; }
        .input-bar input { margin-bottom: 0; flex-grow: 1; }
        .input-bar button { background: var(--neon); border: none; padding: 0 20px; border-radius: 5px; font-weight: bold; }

        .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; border-top: 1px solid #333; z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #444; cursor: pointer; }
        .nav-item.on { color: var(--neon); }
        .icon { font-size: 20px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div id="p-main" class="page active">
        <h2 style="text-align: center;">GHOST <span style="color:#fff">PRO</span></h2>
        <div class="grid">
            <div class="btn-big" onclick="goTo('p-chat')">💬<br>CZAT</div>
            <div class="btn-big" onclick="goTo('p-set')">⚙️<br>USTAW</div>
        </div>
        <div id="info" style="margin-top: 40px; text-align: center; font-size: 12px; color: #555;">Brak sesji</div>
    </div>

    <div id="p-set" class="page">
        <div id="reader"></div>
        <input type="password" id="t" placeholder="GitHub Token">
        <input id="r" placeholder="User/Repo">
        <input type="password" id="c" placeholder="Klucz Szyfru">
        <input id="n" placeholder="Twój Nick">
        <button class="btn-action" onclick="connect()">POŁĄCZ</button>
    </div>

    <div id="p-chat" class="page">
        <div id="st" style="font-size: 10px; text-align: center; margin-bottom: 10px;">Status: Gotowy</div>
        <div id="chat-container"></div>
        <div class="input-bar">
            <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">OK</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item on" id="n-main" onclick="goTo('p-main')"><span class="icon">🏠</span>START</div>
        <div class="nav-item" id="n-chat" onclick="goTo('p-chat')"><span class="icon">💬</span>CZAT</div>
        <div class="nav-item" id="n-set" onclick="goTo('p-set')"><span class="icon">⚙️</span>USTAW</div>
    </div>

<script>
    let hist = "", sha = "", path = "", scanner = null;
    const $ = id => document.getElementById(id);

    // 1. NAWIGACJA
    async function goTo(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('on'));
        
        $(id).classList.add('active');
        $('n-' + id.split('-')[1]).classList.add('on');

        if (id === 'p-set') startQR(); else stopQR();
    }

    // 2. SKANER
    function startQR() {
        if (!scanner) scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
            const d = txt.split('|');
            if(d.length >= 4) {
                $('t').value = d[0]; $('r').value = d[1]; $('c').value = d[2]; $('n').value = d[3];
                connect();
            }
        }).catch(e => console.log("Kamera off"));
    }

    async function stopQR() {
        if (scanner && scanner.isScanning) await scanner.stop();
    }

    // 3. LOGIKA POŁĄCZENIA
    window.onload = () => {
        ['gh_t', 'gh_r', 'gh_n', 'gh_c'].forEach(k => {
            if(localStorage.getItem(k)) $(k.replace('gh_','')).value = localStorage.getItem(k);
        });
        if ($('c').value) $('info').innerText = "Sesja: " + $('r').value;
    };

    function connect() {
        if (!$('t').value || !$('c').value) return alert("Wpisz dane!");
        const room = CryptoJS.MD5($('c').value).toString().substring(0, 10);
        path = "pokoje/" + room + ".txt";

        localStorage.setItem('gh_t', $('t').value);
        localStorage.setItem('gh_r', $('r').value);
        localStorage.setItem('gh_n', $('n').value);
        localStorage.setItem('gh_c', $('c').value);

        goTo('p-chat');
        setInterval(fetchData, 4000);
        fetchData();
    }

    // 4. GITHUB API
    async function fetchData() {
        if (!path) return;
        try {
            const r = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?cb=${Date.now()}`, {
                headers: {'Authorization': `token ${$('t').value}`}
            });
            if (r.ok) {
                const d = await r.json();
                sha = d.sha;
                const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
                if (dec && dec !== hist) {
                    $('chat-container').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                    $('chat-container').scrollTop = $('chat-container').scrollHeight;
                    hist = dec;
                }
            }
        } catch (e) {}
    }

    async function sendMsg() {
        const val = $('m').value.trim();
        if (!val || !path) return;
        const entry = `<span class="ts">[${new Date().toLocaleTimeString()}]</span> <b>${$('n').value}:</b> ${val}`;
        const full = hist + (hist ? "\n" : "") + entry;
        const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());

        const r = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
            method: 'PUT',
            headers: {'Authorization': `token ${$('t').value}`},
            body: JSON.stringify({message: "msg", content: enc, sha: sha})
        });
        if (r.ok) { $('m').value = ""; fetchData(); }
    }
</script>
</body>
</html>
