<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Chat PRO - Budowa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --neon-green: #0f4; --dark-bg: #050505; --gray: #1a1a1a; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', monospace; background: var(--dark-bg); color: var(--neon-green); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- WIDOKI (PAGES) --- */
        .page { display: none; flex-direction: column; height: calc(100vh - 60px); width: 100%; overflow-y: auto; padding: 20px; }
        .active-page { display: flex; }

        /* --- MENU GŁÓWNE --- */
        #main-menu { text-align: center; justify-content: center; gap: 20px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { background: #111; border: 1px solid var(--neon-green); padding: 25px 10px; border-radius: 12px; cursor: pointer; text-transform: uppercase; font-weight: bold; font-size: 13px; }
        .menu-item:active { background: var(--neon-green); color: #000; }

        /* --- LOGOWANIE / SETUP --- */
        .box { border: 2px solid var(--neon-green); padding: 15px; border-radius: 8px; background: #000; display: flex; flex-direction: column; gap: 10px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #111; border: 1px dashed var(--neon-green); margin-bottom: 10px; }
        
        input { background: #111; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 12px; font-size: 16px; border-radius: 4px; width: 100%; }
        button.primary { background: var(--neon-green); color: #000; border: none; padding: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }

        /* --- CZAT --- */
        #chat-ui { padding: 0; }
        #status { font-size: 11px; padding: 8px; text-align: center; background: #0a1a0a; border-bottom: 1px solid #041; color: #fff; }
        #chat-container { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { border-bottom: 1px solid #111; padding-bottom: 5px; word-break: break-all; font-size: 14px; }
        .ts { color: #062; font-size: 10px; margin-right: 5px; }
        .n { font-weight: bold; color: #fff; }

        .input-bar { background: #000; padding: 10px; display: flex; gap: 8px; border-top: 1px solid var(--neon-green); }
        .input-bar input { flex-grow: 1; }
        .input-bar button { width: 60px; padding: 10px; background: var(--neon-green); border: none; font-weight: bold; border-radius: 4px; }

        /* --- DOLNA NAWIGACJA --- */
        .nav-bar { height: 60px; background: #000; border-top: 2px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-btn { color: #555; text-align: center; font-size: 10px; flex: 1; cursor: pointer; font-weight: bold; }
        .nav-btn.active { color: var(--neon-green); }
        .nav-btn span { display: block; font-size: 20px; }
    </style>
</head>
<body>

    <div id="main-menu" class="page active-page">
        <h1 style="margin-bottom: 30px;">GHOST <span style="color:#fff">PRO</span></h1>
        <div class="menu-grid">
            <div class="menu-item" onclick="showPage('chat-ui')"><span>💬</span><br>Czat</div>
            <div class="menu-item" onclick="showPage('setup')"><span>⚙️</span><br>Ustawienia</div>
        </div>
        <div id="session-info" style="margin-top: 40px; font-size: 12px; color: #444;">Brak aktywnego połączenia</div>
    </div>

    <div id="setup" class="page">
        <div id="status-qr" style="text-align: center; margin-bottom: 5px;">SKANUJ KOD KONFIGURACJI</div>
        <div id="reader"></div>
        <div class="box">
            <input type="password" id="t" placeholder="GitHub Token">
            <input id="r" placeholder="User/Repo">
            <input type="password" id="c" placeholder="Klucz (Hasło pokoju)">
            <input id="n" placeholder="Twój Nick">
            <button class="primary" onclick="init()">Zapisz i Połącz</button>
        </div>
    </div>

    <div id="chat-ui" class="page">
        <div id="status">NIEZALOGOWANY</div>
        <div id="chat-container"></div>
        <div class="input-bar">
            <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">OK</button>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-btn" onclick="showPage('main-menu')" id="nav-home"><span>🏠</span>START</div>
        <div class="nav-btn" onclick="goBack()" id="nav-back"><span>⬅️</span>WSTECZ</div>
        <div class="nav-btn" onclick="showPage('chat-ui')" id="nav-chat"><span>💬</span>CZAT</div>
    </nav>

<script>
    let history = "", sha = "", path = "", qrScanner, currentPage = 'main-menu';
    const $ = id => document.getElementById(id);

    // --- NAWIGACJA MIĘDZY STRONAMI ---
    function showPage(pageId) {
        // Ukryj wszystkie strony
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        // Pokaż wybraną stronę
        $(pageId).classList.add('active-page');
        
        // Aktualizacja wyglądu menu dolnego
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if(pageId === 'main-menu') $('nav-home').classList.add('active');
        if(pageId === 'chat-ui') $('nav-chat').classList.add('active');

        // Zarządzanie skanerem (wyłączamy jeśli nie jesteśmy w setup)
        if (pageId === 'setup') {
            startScanner();
        } else if (qrScanner) {
            stopScanner();
        }

        currentPage = pageId;
    }

    function goBack() {
        if (currentPage === 'chat-ui' || currentPage === 'setup') {
            showPage('main-menu');
        }
    }

    // --- SKANER ---
    function startScanner() {
        if (!qrScanner) qrScanner = new Html5Qrcode("reader");
        const config = { fps: 15, qrbox: 250 };
        qrScanner.start({ facingMode: "environment" }, config, (txt) => {
            const d = txt.split('|');
            if(d.length >= 4) {
                $('t').value = d[0]; $('r').value = d[1]; $('c').value = d[2]; $('n').value = d[3];
                navigator.vibrate(100);
                init();
            }
        }).catch(e => $('status-qr').innerText = "BŁĄD KAMERY");
    }

    async function stopScanner() {
        if (qrScanner && qrScanner.isScanning) {
            try { await qrScanner.stop(); } catch(e) {}
        }
    }

    // --- INICJALIZACJA I CZAT ---
    window.onload = () => {
        ['gh_t', 'gh_r', 'gh_n', 'gh_c'].forEach(k => {
            if(localStorage.getItem(k)) $(k.replace('gh_','')).value = localStorage.getItem(k);
        });
        if($('c').value) $('session-info').innerText = "Ostatnia sesja: " + $('r').value;
    };

    async function init() {
        const key = $('c').value;
        if(!key || !$('t').value) return alert("Brak danych!");

        const roomHash = CryptoJS.MD5(key).toString().substring(0, 10);
        path = "pokoje/" + roomHash + ".txt";

        await stopScanner();

        localStorage.setItem('gh_t', $('t').value);
        localStorage.setItem('gh_r', $('r').value);
        localStorage.setItem('gh_n', $('n').value);
        localStorage.setItem('gh_c', key);

        $('status').innerText = `POKÓJ: ${roomHash} | USER: ${$('n').value}`;
        $('session-info').innerText = "Połączono: " + $('r').value;
        
        showPage('chat-ui');
        setInterval(fetchMessages, 4000);
        fetchMessages();
    }

    async function fetchMessages() {
        if(!path || currentPage !== 'chat-ui') return;
        try {
            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?t=${Date.now()}`, {
                headers: {'Authorization': `token ${$('t').value}`}
            });
            if (res.ok) {
                const d = await res.json();
                sha = d.sha;
                const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
                if (dec && dec !== history) {
                    $('chat-container').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                    $('chat-container').scrollTop = $('chat-container').scrollHeight;
                    history = dec;
                }
            }
        } catch (e) {}
    }

    async function send() {
        const m = $('m').value.trim();
        if(!m) return;
        const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const entry = `<span class="ts">[${time}]</span> <span class="n">${$('n').value}:</span> ${m}`;
        const full = history + (history ? "\n" : "") + entry;
        const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());

        const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
            method: 'PUT',
            headers: {'Authorization': `token ${$('t').value}`},
            body: JSON.stringify({message: "msg", content: enc, sha: sha})
        });
        if(res.ok) { $('m').value = ""; fetchMessages(); }
    }

    // Reakcja na powrót do karty
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === 'visible' && path) fetchMessages();
    });
</script>
</body>
</html>
