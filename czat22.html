<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Chat PRO - System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --neon-green: #0f4; --dark-bg: #050505; --gray: #1a1a1a; --card-bg: #111; }
        body { font-family: 'Segoe UI', monospace; background: var(--dark-bg); color: var(--neon-green); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- NAWIGACJA STRON --- */
        .page { display: none; flex-direction: column; height: calc(100vh - 70px); width: 100%; overflow-y: auto; }
        .active-page { display: flex; }

        /* --- DASHBOARD (START) --- */
        #main-menu { padding: 20px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-item { background: var(--card-bg); border: 1px solid #222; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; }
        .menu-item:active { background: var(--neon-green); color: #000; }

        /* --- KONFIGURACJA --- */
        #setup { padding: 15px; box-sizing: border-box; gap: 10px; }
        #reader { width: 100%; min-height: 250px; border-radius: 12px; background: #000; border: 1px dashed var(--neon-green); margin-bottom: 10px; }

        /* --- CZAT --- */
        #chat-ui { display: none; flex-direction: column; }
        #chat-container { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 140px; }
        .msg { border-bottom: 1px solid #111; padding: 8px; word-break: break-all; background: #080808; border-radius: 4px; }
        .ts { color: #062; font-size: 10px; margin-right: 5px; }
        .n { font-weight: bold; color: #fff; }

        /* --- WEJŚCIE TEKSTU --- */
        .input-bar { position: fixed; bottom: 70px; left: 0; right: 0; background: #000; padding: 10px; display: flex; gap: 8px; border-top: 1px solid var(--neon-green); z-index: 100; }
        input { background: #111; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 12px; font-size: 16px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        button { background: var(--neon-green); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        /* --- DOLNY NAVBAR --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 200; }
        .nav-btn { color: #444; text-align: center; flex: 1; cursor: pointer; font-size: 12px; }
        .nav-btn.active { color: var(--neon-green); }
        .nav-icon { font-size: 24px; display: block; }
    </style>
</head>
<body>

    <div id="main-menu" class="page active-page">
        <h2 style="text-align: center;">GHOST <span style="color:#fff">PRO</span></h2>
        <div class="grid">
            <div class="menu-item" onclick="showPage('chat-ui')">
                <span class="nav-icon">💬</span><span>CZAT</span>
            </div>
            <div class="menu-item" onclick="showPage('setup')">
                <span class="nav-icon">⚙️</span><span>USTAW</span>
            </div>
        </div>
        <div id="session-info" style="margin-top: 30px; font-size: 12px; color: #555; text-align: center;">
            Brak aktywnej sesji
        </div>
    </div>

    <div id="setup" class="page">
        <div id="status-qr">SKANER GOTOWY</div>
        <div id="reader"></div>
        <input type="password" id="t" placeholder="GitHub Token">
        <input id="r" placeholder="User/Repo">
        <input type="password" id="c" placeholder="Klucz pokoju">
        <input id="n" placeholder="Twój Nick">
        <button onclick="init()" style="width: 100%;">POŁĄCZ I ZAPISZ</button>
    </div>

    <div id="chat-ui" class="page">
        <div id="status" style="font-size: 10px; text-align: center; padding: 5px; background: #0a0a0a;">ŁĄCZENIE...</div>
        <div id="chat-container"></div>
        <div class="input-bar">
            <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">OK</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-btn active" id="btn-main" onclick="showPage('main-menu')"><span class="nav-icon">🏠</span>START</div>
        <div class="nav-btn" id="btn-chat" onclick="showPage('chat-ui')"><span class="nav-icon">💬</span>CZAT</div>
        <div class="nav-btn" id="btn-setup" onclick="showPage('setup')"><span class="nav-icon">⚙️</span>USTAW</div>
    </nav>

<script>
    let history = "", sha = "", path = "", qrScanner = null;
    const $ = id => document.getElementById(id);

    // --- NAWIGACJA (POPRAWIONA) ---
    async function showPage(pageId) {
        // Ukryj wszystko
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

        // Pokaż wybraną
        const target = $(pageId);
        target.style.display = (pageId === 'chat-ui' || pageId === 'main-menu') ? 'flex' : 'block';
        if (pageId === 'chat-ui') target.classList.add('active-page');

        // Aktywuj przycisk w navi
        if(pageId === 'main-menu') $('btn-main').classList.add('active');
        if(pageId === 'chat-ui') $('btn-chat').classList.add('active');
        if(pageId === 'setup') $('btn-setup').classList.add('active');

        // Obsługa skanera
        if (pageId === 'setup') {
            startScanner();
        } else {
            stopScanner();
        }
    }

    // --- SKANER (POPRAWIONY) ---
    function startScanner() {
        if (!qrScanner) {
            qrScanner = new Html5Qrcode("reader");
        }
        qrScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (txt) => {
                const d = txt.split('|');
                if(d.length >= 4) {
                    $('t').value = d[0]; $('r').value = d[1]; $('c').value = d[2]; $('n').value = d[3];
                    navigator.vibrate(100);
                    init();
                }
            }
        ).catch(err => { $('status-qr').innerText = "Kamera zablokowana"; });
    }

    async function stopScanner() {
        if (qrScanner && qrScanner.isScanning) {
            await qrScanner.stop();
        }
    }

    // --- LOGIKA CZATU (TWOJA) ---
    window.onload = () => {
        ['gh_t', 'gh_r', 'gh_n', 'gh_c'].forEach(k => {
            if(localStorage.getItem(k)) $(k.replace('gh_','')).value = localStorage.getItem(k);
        });
        if($('c').value) {
            $('session-info').innerText = "Gotowy do połączenia z: " + $('r').value;
        }
    };

    async function init() {
        if(!$('c').value || !$('t').value) return alert("Brak danych!");
        const roomHash = CryptoJS.MD5($('c').value).toString().substring(0, 10);
        path = "pokoje/" + roomHash + ".txt";
        
        localStorage.setItem('gh_t', $('t').value);
        localStorage.setItem('gh_r', $('r').value);
        localStorage.setItem('gh_n', $('n').value);
        localStorage.setItem('gh_c', $('c').value);

        await stopScanner();
        showPage('chat-ui');
        
        $('status').innerText = `POKÓJ: ${roomHash}`;
        setInterval(fetchMessages, 4000);
        fetchMessages();
    }

    async function fetchMessages() {
        if(!path) return;
        try {
            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?t=${Date.now()}`, {
                headers: {'Authorization': `token ${$('t').value}`}
            });
            if (res.ok) {
                const d = await res.json();
                sha = d.sha;
                const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
                if (dec && dec !== history) {
                    $('chat-container').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                    $('chat-container').scrollTop = $('chat-container').scrollHeight;
                    history = dec;
                }
            } else if (res.status === 404) {
                $('chat-container').innerHTML = "<div style='text-align:center; color:#444;'>Pokój jest pusty. Wyślij pierwszą wiadomość!</div>";
            }
        } catch (e) { console.error(e); }
    }

    async function send() {
        const m = $('m').value.trim();
        if(!m || !path) return;
        const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const entry = `<span class="ts">[${time}]</span> <span class="n">${$('n').value}:</span> ${m}`;
        const full = history + (history ? "\n" : "") + entry;
        const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());

        try {
            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
                method: 'PUT',
                headers: {'Authorization': `token ${$('t').value}`},
                body: JSON.stringify({message: "send msg", content: enc, sha: sha})
            });
            if(res.ok) { $('m').value = ""; fetchMessages(); }
        } catch(e) { alert("Błąd wysyłania!"); }
    }
</script>
</body>
</html>
