<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Chat PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --neon-green: #0f4; --dark-bg: #050505; --gray: #1a1a1a; --card-bg: #111; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--dark-bg); color: var(--neon-green); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- MENU GŁÓWNE (DASHBOARD) --- */
        #main-menu { display: flex; flex-direction: column; padding: 20px; gap: 20px; flex-grow: 1; overflow-y: auto; }
        .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #222; }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { background: var(--card-bg); border: 1px solid #222; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; }
        .menu-item:active { background: var(--neon-green); color: #000; }
        .menu-item i { display: block; font-size: 24px; margin-bottom: 10px; }
        .menu-item span { font-size: 12px; font-weight: bold; text-transform: uppercase; }

        /* --- SEKCJE --- */
        .page { display: none; flex-direction: column; height: 100vh; width: 100%; position: absolute; top: 0; left: 0; background: var(--dark-bg); z-index: 10; }
        .active-page { display: flex; }

        /* --- KONFIGURACJA (SETUP) --- */
        #setup { padding: 20px; gap: 10px; overflow-y: auto; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; border: 1px dashed var(--neon-green); }

        /* --- INTERFEJS CZATU --- */
        #chat-ui { height: 100vh; display: none; flex-direction: column; }
        #status { font-size: 11px; padding: 8px; text-align: center; background: #0a1a0a; border-bottom: 1px solid #041; color: #fff; }
        #chat-container { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 120px; }
        .msg { background: #0c0c0c; border-left: 3px solid var(--neon-green); padding: 10px; border-radius: 0 8px 8px 0; font-size: 14px; color: #eee; }
        .ts { color: #062; font-size: 10px; display: block; margin-bottom: 4px; }
        .n { font-weight: bold; color: var(--neon-green); margin-right: 5px; }

        /* --- ELEMENTY FORMULARZY --- */
        input { background: #111; border: 1px solid #333; color: var(--neon-green); padding: 15px; font-size: 16px; border-radius: 8px; width: 100%; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--neon-green); }
        button { background: var(--neon-green); color: #000; border: none; padding: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }

        /* --- DOLNE MENU (NAVBAR) --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-btn { color: #555; text-align: center; font-size: 10px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
        .nav-btn.active { color: var(--neon-green); }
        .nav-icon { font-size: 20px; }

        /* --- INPUT BAR (DLA CZATU) --- */
        .input-bar { position: fixed; bottom: 60px; left: 0; right: 0; background: #000; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #222; z-index: 99; }
    </style>
</head>
<body>

<div id="main-menu" class="active-page">
    <div class="header">
        <h1>GHOST CHAT <span style="color:#fff">PRO</span></h1>
        <div style="font-size: 10px; margin-top: 5px; color: #555;">SYSTEM OPERACYJNY BUDOWA v2.0</div>
    </div>
    
    <div class="grid">
        <div class="menu-item" onclick="showPage('chat-ui')">
            <div class="nav-icon">💬</div>
            <span>Otwórz Czat</span>
        </div>
        <div class="menu-item" onclick="showPage('setup')">
            <div class="nav-icon">📷</div>
            <span>Skanuj QR</span>
        </div>
        <div class="menu-item" onclick="location.reload()">
            <div class="nav-icon">🔄</div>
            <span>Odśwież</span>
        </div>
        <div class="menu-item" onclick="alert('Zaszyfrowano AES-256')">
            <div class="nav-icon">🔒</div>
            <span>Status</span>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <div style="font-size: 12px; color: #444; margin-bottom: 10px;">OSTATNI POKÓJ:</div>
        <div id="last-room-info" style="font-size: 14px; color: #0a0;">BRAK DANYCH SESJI</div>
    </div>
</div>

<div id="setup" class="page">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <h3>KONFIGURACJA</h3>
        <button onclick="showPage('main-menu')" style="padding: 5px 10px; font-size: 12px;">X</button>
    </div>
    <div id="status-qr" style="font-size: 11px; text-align: center;">APARAT GOTOWY</div>
    <div id="reader"></div>
    <input type="password" id="t" placeholder="GitHub Token">
    <input id="r" placeholder="User/Repo">
    <input type="password" id="c" placeholder="Klucz (Hasło pokoju)">
    <input id="n" placeholder="Twój Nick">
    <button onclick="init()">POŁĄCZ I ZAPISZ</button>
</div>

<div id="chat-ui" class="page">
    <div id="status">ŁĄCZENIE Z GITHUB...</div>
    <div id="chat-container"></div>
    
    <div class="input-bar">
        <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">OK</button>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-btn active" id="btn-home" onclick="showPage('main-menu')">
        <div class="nav-icon">🏠</div>
        <span>START</span>
    </div>
    <div class="nav-btn" id="btn-chat" onclick="showPage('chat-ui')">
        <div class="nav-icon">💬</div>
        <span>CZAT</span>
    </div>
    <div class="nav-btn" id="btn-setup" onclick="showPage('setup')">
        <div class="nav-icon">⚙️</div>
        <span>USTAWIENIA</span>
    </div>
</nav>

<script>
    let history = "", sha = "", path = "", qrScanner;
    const $ = id => document.getElementById(id);

    // --- NAWIGACJA MIĘDZY STRONAMI ---
    function showPage(pageId) {
        document.querySelectorAll('.page, #main-menu').forEach(p => p.classList.remove('active-page'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        $(pageId).classList.add('active-page');
        if(pageId === 'main-menu') $('btn-home').classList.add('active');
        if(pageId === 'chat-ui') $('btn-chat').classList.add('active');
        if(pageId === 'setup') $('btn-setup').classList.add('active');

        if(pageId === 'setup') startScanner(); else if(qrScanner) stopScanner();
    }

    // --- TWOJA LOGIKA (BEZ ZMIAN) ---
    window.onbeforeunload = () => "Czy na pewno?";

    window.onload = () => {
        ['gh_t', 'gh_r', 'gh_n', 'gh_c'].forEach(k => {
            if(localStorage.getItem(k)) {
                $(k.replace('gh_','')).value = localStorage.getItem(k);
                if(k === 'gh_c') $('last-room-info').innerText = "POKÓJ: " + localStorage.getItem(k).substring(0,8) + "...";
            }
        });
    };

    function startScanner() {
        qrScanner = new Html5Qrcode("reader");
        qrScanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => {
            const d = txt.split('|');
            if(d.length >= 4) {
                $('t').value = d[0]; $('r').value = d[1]; $('c').value = d[2]; $('n').value = d[3];
                init();
            }
        }).catch(e => $('status-qr').innerText = "BŁĄD KAMERY");
    }

    async function stopScanner() {
        if(qrScanner) { try { await qrScanner.stop(); } catch(e){} }
    }

    async function init() {
        const key = $('c').value;
        if(!key || !$('t').value) return alert("Brak danych!");
        const roomHash = CryptoJS.MD5(key).toString().substring(0, 10);
        path = "pokoje/" + roomHash + ".txt";
        await stopScanner();
        
        localStorage.setItem('gh_t', $('t').value);
        localStorage.setItem('gh_r', $('r').value);
        localStorage.setItem('gh_n', $('n').value);
        localStorage.setItem('gh_c', key);

        showPage('chat-ui');
        $('status').innerText = `POKÓJ: ${roomHash} | UŻYTKOWNIK: ${$('n').value}`;
        setInterval(fetchMessages, 4000);
        fetchMessages();
    }

    async function fetchMessages() {
        if(!path) return;
        try {
            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?t=${Date.now()}`, {
                headers: {'Authorization': `token ${$('t').value}`}
            });
            if (res.ok) {
                const d = await res.json();
                sha = d.sha;
                const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
                if (dec && dec !== history) {
                    $('chat-container').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                    $('chat-container').scrollTop = $('chat-container').scrollHeight;
                    history = dec;
                }
            }
        } catch (e) {}
    }

    async function send() {
        const m = $('m').value.trim();
        if(!m) return;
        const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const entry = `<span class="ts">${time}</span><span class="n">${$('n').value}:</span> ${m}`;
        const full = history + (history ? "\n" : "") + entry;
        const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());

        const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
            method: 'PUT',
            headers: {'Authorization': `token ${$('t').value}`},
            body: JSON.stringify({message: "msg", content: enc, sha: sha})
        });
        if(res.ok) { $('m').value = ""; fetchMessages(); }
    }
</script>
</body>
</html>
