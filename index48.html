<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Lista plików repo</title>

<style>
body {
    font-family: monospace;
    background:#111;
    color:#0f4;
    padding:20px;
}

h1 {
    border-bottom:1px solid #0f4;
    padding-bottom:10px;
}

ul {
    list-style:none;
    padding:0;
}

li {
    margin:6px 0;
}

a {
    color:#0f4;
    text-decoration:none;
}

a:hover {
    text-decoration:underline;
}

.folder::before { content:"📁 "; }
.html::before   { content:"📄 "; }
.img::before    { content:"🖼 "; }
.other::before  { content:"📦 "; }

.back {
    margin-bottom:15px;
    display:inline-block;
}
</style>
</head>
<body>

<h1>📂 Zawartość repozytorium</h1>
<div id="nav"></div>
<ul id="file-list"></ul>

<script>
const OWNER = "OWNER";  // ← wpisz właściciela
const REPO  = "REPO";   // ← wpisz nazwę repo

const list = document.getElementById("file-list");
const nav  = document.getElementById("nav");

async function loadPath(path = "") {

    list.innerHTML = "";
    nav.innerHTML = "";

    if (path) {
        const backPath = path.split("/").slice(0,-1).join("/");
        nav.innerHTML = `<a class="back" href="#" onclick="loadPath('${backPath}')">⬅ Wstecz</a>`;
    }

    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;

    const res = await fetch(url);
    const data = await res.json();

    data.forEach(item => {
        const li = document.createElement("li");
        const a  = document.createElement("a");

        if (item.type === "dir") {
            a.textContent = item.name;
            a.href = "#";
            a.className = "folder";
            a.onclick = () => loadPath(item.path);
        } 
        else {
            a.textContent = item.name;
            a.href = item.download_url;
            a.target = "_blank";

            if (item.name.endsWith(".html")) {
                a.className = "html";
            } 
            else if (item.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                a.className = "img";
            } 
            else {
                a.className = "other";
            }
        }

        li.appendChild(a);
        list.appendChild(li);
    });
}

loadPath();
</script>

</body>
</html>
