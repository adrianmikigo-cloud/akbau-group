<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Ghost Chat Live QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body{font-family:monospace;background:#000;color:#0f4;margin:0;padding:10px;display:flex;flex-direction:column;height:100vh;box-sizing:border-box}
        .box{border:1px solid #0f4;padding:15px;border-radius:5px;background:#050505;margin-bottom:10px}
        input{background:#000;border:1px solid #0f4;color:#0f4;padding:12px;margin:5px 0;width:100%;box-sizing:border-box;font-size:16px}
        button{background:#0f4;color:#000;border:none;padding:15px;width:100%;font-weight:700;cursor:pointer;margin-top:10px;text-transform:uppercase}
        #chat{flex-grow:1;border:1px solid #141;background:#050505;overflow-y:auto;padding:10px;margin:10px 0;font-size:13px;display:none}
        #status{font-size:11px;text-align:center;color:#0f4;margin-bottom:8px;padding:8px;background:#020;border:1px solid #0f4}
        /* Kontener skanera - wymuszony aspekt 1:1 dla stabilności */
        #reader { width: 100%; max-width: 400px; margin: 0 auto 15px auto; background: #111; border: 2px solid #0f4; overflow: hidden; position: relative;}
        .msg{margin-bottom:5px; border-bottom: 1px solid #020; word-break: break-all}
    </style>
</head>
<body>

<div id="setup" class="box">
    <div id="status">INICJOWANIE APARATU...</div>
    <div id="reader"></div>
    <button onclick="startLiveScanner()" style="background:#222; color:#0f4; font-size:12px; border:1px solid #0f4">RESTART KAMERY</button>

    <div style="margin-top:15px">
        <input type="password" id="t" placeholder="GitHub Token">
        <input id="r" placeholder="User/Repo">
        <input type="password" id="c" placeholder="Klucz szyfru">
        <input id="n" placeholder="Nick">
        <button onclick="init()">WEJDŹ DO CZATU</button>
    </div>
</div>

<div id="chat-ui" style="display:none; flex-direction:column; flex-grow:1">
    <div id="chat"></div>
    <div style="display:flex;gap:5px">
        <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') send()">
        <button style="width:70px;margin:5px 0" onclick="send()">OK</button>
    </div>
</div>

<script>
let lastContent = "", currentSha = "", path = "czat2.txt";
let html5QrCode;
const $ = id => document.getElementById(id);

window.onload = () => {
    // Wypełnij dane jeśli są w pamięci
    ['gh_t', 'gh_r', 'gh_n', 'gh_c'].forEach(k => {
        if(localStorage.getItem(k)) $(k.replace('gh_','')).value = localStorage.getItem(k);
    });
    // Startuj skaner od razu
    startLiveScanner();
};

async function startLiveScanner() {
    if (html5QrCode) {
        try { await html5QrCode.stop(); } catch(e) {}
    }

    html5QrCode = new Html5Qrcode("reader");
    
    // Konfiguracja "agresywna" dla tynej kamery
    const qrConfig = { 
        fps: 20, 
        qrbox: (viewWidth, viewHeight) => {
            return { width: viewWidth * 0.7, height: viewWidth * 0.7 };
        },
        aspectRatio: 1.0
    };

    // Próba uruchomienia tylnej kamery
    html5QrCode.start(
        { facingMode: { exact: "environment" } }, 
        qrConfig, 
        onScanSuccess
    ).catch(err => {
        // Jeśli 'exact' zawiedzie (np. komputer), próbujemy zwykłe 'environment'
        console.warn("Próba z 'exact' nieudana, próbuję trybu ogólnego.");
        html5QrCode.start({ facingMode: "environment" }, qrConfig, onScanSuccess)
            .catch(e => {
                $('status').innerText = "BŁĄD: Brak HTTPS lub uprawnień.";
                $('status').style.background = "#400";
            });
    });
}

function onScanSuccess(decodedText) {
    const data = decodedText.split('|');
    if(data.length >= 4) {
        $('t').value = data[0];
        $('r').value = data[1];
        $('c').value = data[2];
        $('n').value = data[3];
        $('status').innerText = "ZESKANOWANO! ŁĄCZENIE...";
        $('status').style.background = "#060";
        init();
    }
}

async function init() {
    if (html5QrCode && html5QrCode.isScanning) {
        try { await html5QrCode.stop(); } catch(e) {}
    }

    localStorage.setItem('gh_t', $('t').value);
    localStorage.setItem('gh_r', $('r').value);
    localStorage.setItem('gh_n', $('n').value);
    localStorage.setItem('gh_c', $('c').value);

    $('setup').style.display = 'none';
    $('chat-ui').style.display = 'flex';
    $('chat').style.display = 'block';
    
    setInterval(fetchMessages, 4000);
    fetchMessages();
}

// Funkcje komunikacji z GitHub (bez zmian)
async function fetchMessages() {
    try {
        const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?t=${Date.now()}`, {
            headers: {'Authorization': `token ${$('t').value}`}
        });
        if (res.ok) {
            const d = await res.json();
            currentSha = d.sha;
            const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
            if (dec && dec !== lastContent) {
                $('chat').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                $('chat').scrollTop = $('chat').scrollHeight;
                lastContent = dec;
            }
        }
    } catch (e) {}
}

async function send() {
    if (!$('m').value.trim()) return;
    const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const entry = `<span class="ts">[${time}]</span> <span class="n">${$('n').value}:</span> ${$('m').value}`;
    const full = lastContent + (lastContent ? "\n" : "") + entry;
    const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());
    const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
        method: 'PUT',
        headers: {'Authorization': `token ${$('t').value}`},
        body: JSON.stringify({message: "up", content: enc, sha: currentSha})
    });
    if (res.ok) { $('m').value = ""; fetchMessages(); }
}
</script>
</body>
</html>
