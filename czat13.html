<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Chat PRO V3.1 - Final</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --neon-green: #0f4; --dark-bg: #050505; }
        body { font-family: 'Segoe UI', monospace; background: var(--dark-bg); color: var(--neon-green); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .screen { display: none; flex-direction: column; height: 100vh; width: 100%; position: absolute; top: 0; left: 0; }
        .active { display: flex; }

        #menu { justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; background: radial-gradient(circle, #0a1a0a 0%, #000 100%); }
        .menu-btn { background: #000; border: 2px solid var(--neon-green); color: var(--neon-green); padding: 20px; width: 100%; max-width: 300px; margin: 10px 0; font-weight: bold; font-size: 16px; cursor: pointer; border-radius: 8px; text-transform: uppercase; box-shadow: 0 0 10px rgba(0,255,68,0.2); }
        .menu-btn:active { background: var(--neon-green); color: #000; }

        #setup { padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .box { border: 2px solid var(--neon-green); padding: 15px; border-radius: 8px; background: #000; margin-top: 10px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #111; margin-bottom: 10px; border: 1px dashed var(--neon-green); }
        
        input { background: #111; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 12px; font-size: 16px; border-radius: 4px; width: 100%; box-sizing: border-box; margin: 5px 0; outline: none; }
        .btn-action { background: var(--neon-green); color: #000; border: none; padding: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; margin-top: 10px; width: 100%; }

        #chat-ui { flex-direction: column; height: 100vh; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #0a1a0a; border-bottom: 1px solid #041; }
        .nav-btn { background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 5px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }

        /* --- CZAT WYRÓWNANY DO DOŁU Z ODSTĘPEM --- */
        #chat-container { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; /* Wyrównanie do dołu */
            gap: 10px; 
            margin-bottom: 80px; /* Margines od paska wpisywania */
        }
        
        .msg { border-bottom: 1px solid #111; padding: 8px 0; word-break: break-all; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .ts { color: #062; font-size: 10px; margin-right: 5px; }
        .n { font-weight: bold; color: #fff; text-transform: uppercase; font-size: 12px; }

        .input-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; padding: 12px; display: flex; gap: 8px; border-top: 2px solid var(--neon-green); z-index: 100; }
        .input-bar input { flex-grow: 1; margin: 0; }
        .input-bar button { width: 65px; background: var(--neon-green); color: #000; border: none; font-weight: bold; border-radius: 4px; }
        .input-bar button:disabled { background: #050; }
    </style>
</head>
<body>

    <div id="menu" class="screen active">
        <h1 style="letter-spacing: 3px; color: #fff; margin-bottom: 0;">GHOST CHAT</h1>
        <p style="color: var(--neon-green); margin-bottom: 40px; font-size: 10px;">OPERATIONAL TERMINAL V3.1</p>
        <button class="menu-btn" onclick="startCamera()">[1] SKANUJ KOD QR</button>
        <button class="menu-btn" onclick="goToSetup()">[2] WPISZ RĘCZNIE</button>
        <button class="menu-btn" onclick="safeExit()" style="border-color: #700; color: #f55; margin-top: 50px;">[X] ZAMKNIJ SYSTEM</button>
    </div>

    <div id="setup" class="screen">
        <div class="nav-bar">
            <span>KONFIGURACJA</span>
            <button class="nav-btn" onclick="goToMenu()">WSTECZ</button>
        </div>
        <div id="reader"></div>
        <div class="box">
            <input type="password" id="t" placeholder="GitHub Token">
            <input id="r" placeholder="User/Repozytorium">
            <input type="password" id="c" placeholder="Klucz szyfru">
            <input id="n" placeholder="Nick">
            <button class="btn-action" onclick="init()">AUTORYZUJ</button>
        </div>
    </div>

    <div id="chat-ui" class="screen">
        <div class="nav-bar">
            <span id="status-text" style="font-size: 10px;">ŁĄCZENIE...</span>
            <button class="nav-btn" onclick="safeExit()">WYJDŹ</button>
        </div>
        <div id="chat-container"></div>
        <div class="input-bar">
            <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') send()">
            <button id="send-btn" onclick="send()">OK</button>
        </div>
    </div>

<script>
    let history = "", sha = "", path = "", qrScanner;
    const $ = id => document.getElementById(id);

    window.onbeforeunload = () => "Czy na pewno opuścić system?";

    function safeExit() {
        if(confirm("ZAMKNĄĆ SESJĘ I WYCZYŚCIĆ RAM?")) {
            window.location.reload();
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        $(id).classList.add('active');
    }

    function goToMenu() { if(qrScanner) qrScanner.stop(); showScreen('menu'); }

    function goToSetup() {
        showScreen('setup');
        if(localStorage.getItem('gh_r')) $('r').value = localStorage.getItem('gh_r');
        if(localStorage.getItem('gh_n')) $('n').value = localStorage.getItem('gh_n');
    }

    function startCamera() {
        goToSetup();
        qrScanner = new Html5Qrcode("reader");
        qrScanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (txt) => {
            const d = txt.split('|');
            if(d.length >= 4) {
                $('t').value = d[0]; $('r').value = d[1]; $('c').value = d[2]; $('n').value = d[3];
                init();
            }
        }).catch(e => console.log("Czekam..."));
    }

    async function init() {
        const key = $('c').value;
        if(!key || !$('t').value) return alert("Brak danych!");
        
        const roomHash = CryptoJS.MD5(key).toString().substring(0, 10);
        path = "pokoje/" + roomHash + ".txt";

        if(qrScanner) try { await qrScanner.stop(); } catch(e){}

        localStorage.setItem('gh_r', $('r').value);
        localStorage.setItem('gh_n', $('n').value);
        
        showScreen('chat-ui');
        setInterval(fetchMessages, 4000);
        fetchMessages();
    }

    async function fetchMessages() {
        if(!path) return;
        try {
            // CACHE BUSTER - Wymusza pobranie najnowszej wersji z serwera
            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?cb=${Date.now()}`, {
                headers: {
                    'Authorization': `token ${$('t').value}`,
                    'Cache-Control': 'no-cache'
                }
            });
            if (res.ok) {
                const d = await res.json();
                sha = d.sha;
                const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
                if (dec && dec !== history) {
                    $('chat-container').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                    $('chat-container').scrollTop = $('chat-container').scrollHeight;
                    history = dec;
                    $('status-text').innerText = "POŁĄCZONO ✅";
                }
            } else if(res.status === 404) {
                $('status-text').innerText = "POKÓJ PUSTY";
            }
        } catch (e) { $('status-text').innerText = "BŁĄD SYNC ❌"; }
    }

    async function send() {
        const m = $('m').value.trim();
        if(!m) return;
        const btn = $('send-btn');
        btn.disabled = true;

        const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const entry = `<span class="ts">[${time}]</span> <span class="n">${$('n').value}:</span> ${m}`;
        const full = history + (history ? "\n" : "") + entry;
        const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());

        try {
            const payload = { message: "msg", content: enc };
            if(sha) payload.sha = sha;

            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${$('t').value}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if(res.ok) { 
                const resData = await res.json();
                sha = resData.content.sha;
                $('m').value = ""; 
                // Szybkie wymuszenie odświeżenia
                setTimeout(fetchMessages, 400); 
            }
        } catch(e) { alert("BŁĄD!"); }
        finally { btn.disabled = false; }
    }
</script>
</body>
</html>
