<!-- =================== LOADING OVERLAY =================== -->
<div id="loading-overlay" style="
position:fixed;
inset:0;
background:#000;
color:#0f4;
display:none;
align-items:center;
justify-content:center;
z-index:9999;
font-size:18px;">
ŁADOWANIE...
</div>

<!-- =================== SETUP =================== -->
<div id="setup">

    <h2 style="text-align:center;">GHOST CHAT PRO</h2>

    <div id="status-qr" style="text-align:center; margin-bottom:5px;">
        GOTOWY DO SKANOWANIA
    </div>

    <div id="reader"></div>

    <div class="box">
        <input type="password" id="t" placeholder="GitHub Token">
        <input id="r" placeholder="User/Repo">
        <input type="password" id="c" placeholder="Klucz (Hasło pokoju)">
        <input id="n" placeholder="Twój Nick">

        <button onclick="init()">POŁĄCZ Z POKOJEM</button>
        <button onclick="openInfo()">INFO</button>
    </div>

</div>


<!-- =================== CHAT UI =================== -->
<div id="chat-ui">

    <!-- ===== TOP BAR ===== -->
    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px;
        background:#000;
        border-bottom:2px solid #0f4;">

        <button onclick="goBack()">◀ WSTECZ</button>

        <div id="status" style="font-size:11px;"></div>

        <button onclick="toggleMenu()">☰ MENU</button>
    </div>

    <!-- ===== LICZNIK ===== -->
    <div style="
        text-align:center;
        font-size:11px;
        background:#061;
        padding:4px;">
        Wiadomości: <span id="msg-count">0</span>
    </div>

    <!-- ===== CHAT ===== -->
    <div id="chat-container"></div>

    <!-- ===== INPUT ===== -->
    <div class="input-bar">
        <input id="m" placeholder="Wiadomość..." 
               onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">OK</button>
    </div>
</div>


<!-- =================== PANEL MENU =================== -->
<div id="side-menu" style="
position:fixed;
top:0;
right:-260px;
width:250px;
height:100%;
background:#111;
border-left:2px solid #0f4;
padding:15px;
transition:0.3s;
z-index:500;">

<h3>MENU</h3>

<button onclick="openInfo()">Informacje o pokoju</button>
<button onclick="clearLocal()">Wyczyść czat lokalnie</button>
<button onclick="confirmExit()">Wyjdź z pokoju</button>

</div>


<!-- =================== MODAL WYJŚCIA =================== -->
<div id="exit-modal" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
z-index:1000;
align-items:center;
justify-content:center;">

<div style="
background:#000;
padding:20px;
border:2px solid #0f4;
width:300px;
text-align:center;">

<h3>Czy na pewno chcesz wyjść?</h3>

<button onclick="exitRoom()">TAK</button>
<button onclick="closeModal()">ANULUJ</button>

</div>
</div>


<!-- =================== MODAL INFO =================== -->
<div id="info-modal" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
z-index:1000;
align-items:center;
justify-content:center;">

<div style="
background:#000;
padding:20px;
border:2px solid #0f4;
width:320px;">

<h3>Informacje o pokoju</h3>

<p id="info-content"></p>

<button onclick="closeModal()">ZAMKNIJ</button>

</div>
</div>
