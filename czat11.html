<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Chat PRO V3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --neon-green: #0f4; --dark-bg: #050505; }
        body { font-family: 'Segoe UI', monospace; background: var(--dark-bg); color: var(--neon-green); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Ekrany */
        .screen { display: none; flex-direction: column; height: 100vh; width: 100%; position: absolute; top: 0; left: 0; }
        .active { display: flex; }

        /* Menu Główne */
        #menu { justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .menu-btn { background: #000; border: 2px solid var(--neon-green); color: var(--neon-green); padding: 20px; width: 100%; max-width: 300px; margin: 10px 0; font-weight: bold; font-size: 16px; cursor: pointer; border-radius: 8px; text-transform: uppercase; }
        .menu-btn:active { background: var(--neon-green); color: #000; }

        /* Sekcja Logowania */
        #setup { padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .box { border: 2px solid var(--neon-green); padding: 15px; border-radius: 8px; background: #000; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #111; margin-bottom: 10px; border: 1px dashed var(--neon-green); }
        
        input { background: #111; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 12px; font-size: 16px; border-radius: 4px; width: 100%; box-sizing: border-box; margin: 5px 0; }
        .btn-action { background: var(--neon-green); color: #000; border: none; padding: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; margin-top: 10px; width: 100%; }

        /* Interfejs Czatu */
        #chat-ui { flex-direction: column; height: 100vh; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #0a1a0a; border-bottom: 1px solid #041; }
        .nav-btn { background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }

        /* WIADOMOŚCI OD DOŁU */
        #chat-container { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding-bottom: 80px; }
        .msg { border-bottom: 1px solid #111; padding-bottom: 5px; word-break: break-all; }
        .ts { color: #062; font-size: 10px; margin-right: 5px; }
        .n { font-weight: bold; color: #fff; }

        /* Sticky Input */
        .input-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; padding: 10px; display: flex; gap: 8px; border-top: 2px solid var(--neon-green); z-index: 100; }
        .input-bar input { flex-grow: 1; margin: 0; }
        .input-bar button { width: 60px; padding: 10px; margin-top: 0; background: var(--neon-green); color: #000; border: none; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="menu" class="screen active">
        <h2 style="margin-bottom: 30px; letter-spacing: 2px;">GHOST CHAT PRO</h2>
        <button class="menu-btn" onclick="startCamera()">[1] SKANUJ KOD QR</button>
        <button class="menu-btn" onclick="goToSetup()">[2] WPISZ RĘCZNIE</button>
        <button class="menu-btn" onclick="safeExit()" style="border-color: #500; color: #f55; margin-top: 40px;">[X] WYJDŹ Z APKI</button>
    </div>

    <div id="setup" class="screen">
        <div class="nav-bar">
            <span>KONFIGURACJA</span>
            <button class="nav-btn" onclick="goToMenu()">WSTECZ</button>
        </div>
        <div id="reader"></div>
        <div class="box">
            <input type="password" id="t" placeholder="GitHub Token">
            <input id="r" placeholder="Użytkownik/Repo">
            <input type="password" id="c" placeholder="Hasło pokoju (Klucz)">
            <input id="n" placeholder="Twój Nick">
            <button class="btn-action" onclick="init()">POŁĄCZ Z SERWEREM</button>
        </div>
    </div>

    <div id="chat-ui" class="screen">
        <div class="nav-bar">
            <span id="status-text">ŁĄCZENIE...</span>
            <button class="nav-btn" onclick="safeExit()">WYJDŹ</button>
        </div>
        <div id="chat-container"></div>
        <div class="input-bar">
            <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">OK</button>
        </div>
    </div>

<script>
    let history = "", sha = "", path = "", qrScanner;
    const $ = id => document.getElementById(id);

    // --- PANCERNA BLOKADA WYJŚCIA ---
    window.onbeforeunload = function() {
        return "Masz aktywną sesję. Czy na pewno chcesz wyjść?";
    };

    function safeExit() {
        if(confirm("ZAMKNĄĆ APARAT I WYCZYŚCIĆ SESJĘ? (Wymaga ponownego skanowania)")) {
            // Czyścimy wszystko przed przeładowaniem dla bezpieczeństwa
            $('t').value = ""; $('c').value = "";
            window.location.reload();
        }
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        $(screenId).classList.add('active');
    }

    function goToMenu() {
        if(qrScanner) qrScanner.stop();
        showScreen('menu');
    }

    function goToSetup() {
        showScreen('setup');
        // Tu NIE wczytujemy tokenu i klucza z localStorage - dla bezpieczeństwa
        if(localStorage.getItem('gh_r')) $('r').value = localStorage.getItem('gh_r');
        if(localStorage.getItem('gh_n')) $('n').value = localStorage.getItem('gh_n');
    }

    function startCamera() {
        goToSetup();
        qrScanner = new Html5Qrcode("reader");
        qrScanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => {
            const d = txt.split('|');
            if(d.length >= 4) {
                $('t').value = d[0]; $('r').value = d[1]; $('c').value = d[2]; $('n').value = d[3];
                init();
            }
        }).catch(e => console.log("Kamera czeka..."));
    }

    async function init() {
        if(!$('t').value || !$('c').value) return alert("Wymagany Token i Klucz!");

        const key = $('c').value;
        const roomHash = CryptoJS.MD5(key).toString().substring(0, 10);
        path = "pokoje/" + roomHash + ".txt";

        if(qrScanner) try { await qrScanner.stop(); } catch(e){}

        // Zapisujemy tylko "bezpieczne" dane
        localStorage.setItem('gh_r', $('r').value);
        localStorage.setItem('gh_n', $('n').value);
        
        showScreen('chat-ui');
        $('status-text').innerText = `POKÓJ: ${roomHash}`;

        setInterval(fetchMessages, 4000);
        fetchMessages();
    }

    async function fetchMessages() {
        if(!path) return;
        try {
            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?t=${Date.now()}`, {
                headers: {'Authorization': `token ${$('t').value}`}
            });
            if (res.ok) {
                const d = await res.json();
                sha = d.sha;
                const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
                if (dec && dec !== history) {
                    $('chat-container').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                    // Przewijanie zawsze do najnowszej wiadomości na dole
                    $('chat-container').scrollTop = $('chat-container').scrollHeight;
                    history = dec;
                    $('status-text').innerText = "POŁĄCZONO ✅";
                }
            } else if(res.status === 404) {
                $('status-text').innerText = "POKÓJ PUSTY - WYŚLIJ PIERWSZĄ WIADOMOŚĆ";
            }
        } catch (e) {
            $('status-text').innerText = "BŁĄD POŁĄCZENIA ❌";
        }
    }

    async function send() {
        const m = $('m').value.trim();
        if(!m) return;
        const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const entry = `<span class="ts">[${time}]</span> <span class="n">${$('n').value}:</span> ${m}`;
        const full = history + (history ? "\n" : "") + entry;
        const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());

        try {
            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
                method: 'PUT',
                headers: {'Authorization': `token ${$('t').value}`},
                body: JSON.stringify({message: "msg", content: enc, sha: sha || null})
            });
            if(res.ok) { 
                $('m').value = ""; 
                fetchMessages(); 
            }
        } catch(e) { alert("Błąd wysyłania!"); }
    }
</script>
</body>
</html>
