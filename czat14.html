<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Chat V3.2 Ultimate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --neon-green: #0f4; --dark-bg: #050505; }
        body { font-family: 'Segoe UI', monospace; background: var(--dark-bg); color: var(--neon-green); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .screen { display: none; flex-direction: column; height: 100vh; width: 100%; position: absolute; top: 0; left: 0; }
        .active { display: flex; }

        #menu { justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .menu-btn { background: #000; border: 2px solid var(--neon-green); color: var(--neon-green); padding: 20px; width: 100%; max-width: 300px; margin: 10px 0; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; }

        #setup { padding: 20px; overflow-y: auto; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #111; margin-bottom: 10px; border: 1px dashed var(--neon-green); }
        .box { border: 2px solid var(--neon-green); padding: 15px; border-radius: 8px; background: #000; }
        input { background: #111; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 12px; font-size: 16px; border-radius: 4px; width: 100%; box-sizing: border-box; margin: 5px 0; }
        .btn-action { background: var(--neon-green); color: #000; border: none; padding: 15px; font-weight: bold; width: 100%; margin-top: 10px; border-radius: 4px; }

        /* --- INTERFEJS CZATU --- */
        #chat-ui { height: 100vh; display: none; flex-direction: column; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #0a1a0a; border-bottom: 1px solid #041; z-index: 101; }
        
        /* KONTENER CZATU - WYRÓWNANIE I ODSTĘP */
        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            padding: 15px;
            /* To sprawia, że wiadomości są na dole, ale mają oddech */
            justify-content: flex-end; 
        }

        /* Pusty element roboczy dla zachowania odstępu na dole */
        .spacer { height: 90px; flex-shrink: 0; }

        .msg { border-bottom: 1px solid #111; padding: 10px 0; word-break: break-all; animation: fadeIn 0.2s; }
        .ts { color: #062; font-size: 10px; margin-right: 5px; }
        .n { font-weight: bold; color: #fff; text-transform: uppercase; }

        /* Pasek wpisywania - zawsze na wierzchu */
        .input-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; padding: 12px; display: flex; gap: 8px; border-top: 2px solid var(--neon-green); z-index: 100; }
        .input-bar input { flex: 1; margin: 0; }
        .input-bar button { width: 60px; background: var(--neon-green); color: #000; font-weight: bold; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="menu" class="screen active">
        <h1>GHOST CHAT V3.2</h1>
        <button class="menu-btn" onclick="startCamera()">[1] SKANUJ QR</button>
        <button class="menu-btn" onclick="goToSetup()">[2] WPISZ RĘCZNIE</button>
        <button class="menu-btn" onclick="safeExit()" style="color: #f55; border-color: #700;">[X] WYJDŹ</button>
    </div>

    <div id="setup" class="screen">
        <div class="nav-bar"><span>LOGOWANIE</span><button onclick="goToMenu()">WSTECZ</button></div>
        <div id="reader"></div>
        <div class="box">
            <input type="password" id="t" placeholder="GitHub Token">
            <input id="r" placeholder="User/Repo">
            <input type="password" id="c" placeholder="Klucz">
            <input id="n" placeholder="Nick">
            <button class="btn-action" onclick="init()">POŁĄCZ</button>
        </div>
    </div>

    <div id="chat-ui" class="screen">
        <div class="nav-bar"><span id="st">ŁĄCZENIE...</span><button onclick="safeExit()">LOGOUT</button></div>
        <div id="chat-container">
            <div id="inner-chat"></div>
            <div class="spacer"></div> </div>
        <div class="input-bar">
            <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') send()">
            <button id="sb" onclick="send()">OK</button>
        </div>
    </div>

<script>
    let history = "", sha = "", path = "", qrScanner, isSending = false;
    const $ = id => document.getElementById(id);

    window.onbeforeunload = () => "Wyjść?";

    function safeExit() { if(confirm("WYLOGOWAĆ?")) window.location.reload(); }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }
    function goToMenu() { if(qrScanner) qrScanner.stop(); showScreen('menu'); }
    function goToSetup() { showScreen('setup'); if(localStorage.getItem('gh_r')) $('r').value = localStorage.getItem('gh_r'); if(localStorage.getItem('gh_n')) $('n').value = localStorage.getItem('gh_n'); }

    function startCamera() {
        goToSetup();
        qrScanner = new Html5Qrcode("reader");
        qrScanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (txt) => {
            const d = txt.split('|');
            if(d.length >= 4) { $('t').value=d[0]; $('r').value=d[1]; $('c').value=d[2]; $('n').value=d[3]; init(); }
        }).catch(e => console.log(e));
    }

    async function init() {
        if(!$('t').value || !$('c').value) return alert("Błąd danych!");
        const key = $('c').value;
        path = "pokoje/" + CryptoJS.MD5(key).toString().substring(0, 10) + ".txt";
        if(qrScanner) try { await qrScanner.stop(); } catch(e){}
        localStorage.setItem('gh_r', $('r').value);
        localStorage.setItem('gh_n', $('n').value);
        showScreen('chat-ui');
        setInterval(fetchMessages, 3500); // Odświeżanie co 3.5 sekundy
        fetchMessages();
    }

    async function fetchMessages() {
        if(!path || isSending) return; // Nie pobieraj, gdy wysyłasz
        try {
            // "Cache Buster" + ETag bypass
            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?nocache=${Date.now()}`, {
                headers: {
                    'Authorization': `token ${$('t').value}`,
                    'If-Modified-Since': 'Mon, 26 Jul 1997 05:00:00 GMT', // Wymusza świeżość
                    'Cache-Control': 'no-cache, no-store, must-revalidate'
                }
            });
            if (res.ok) {
                const d = await res.json();
                sha = d.sha;
                const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
                if (dec && dec !== history) {
                    $('inner-chat').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                    $('chat-container').scrollTop = $('chat-container').scrollHeight;
                    history = dec;
                    $('st').innerText = "POŁĄCZONO ✅";
                }
            } else if(res.status === 404) {
                $('st').innerText = "NOWY POKÓJ - WYŚLIJ WIADOMOŚĆ";
            }
        } catch (e) { $('st').innerText = "BŁĄD SYNC ❌"; }
    }

    async function send() {
        const m = $('m').value.trim();
        if(!m || isSending) return;
        isSending = true; // Blokada, żeby fetchMessages nie nadpisało SHA
        $('sb').disabled = true;

        const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const entry = `<span class="ts">[${time}]</span> <span class="n">${$('n').value}:</span> ${m}`;
        const full = history + (history ? "\n" : "") + entry;
        const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());

        try {
            // 1. NAJPIERW POBIERZ AKTUALNE SHA (Klucz do braku lagów!)
            const preRes = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?cb=${Date.now()}`, {
                headers: {'Authorization': `token ${$('t').value}`}
            });
            let currentSha = sha;
            if(preRes.ok) { const preD = await preRes.json(); currentSha = preD.sha; }

            // 2. WYŚLIJ WIADOMOŚĆ
            const res = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${$('t').value}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "msg", content: enc, sha: currentSha || null })
            });

            if(res.ok) { 
                const resData = await res.json();
                sha = resData.content.sha;
                $('m').value = ""; 
                history = full; // Odśwież lokalnie, żeby nie czekać na serwer
                $('inner-chat').innerHTML = full.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                $('chat-container').scrollTop = $('chat-container').scrollHeight;
            }
        } catch(e) { alert("BŁĄD WYSYŁANIA!"); }
        finally { isSending = false; $('sb').disabled = false; }
    }
</script>
</body>
</html>
