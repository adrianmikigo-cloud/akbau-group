<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST PRO v7</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --neon: #0f4; --bg: #050505; --red: #ff4444; --dim: #222; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: monospace; background: var(--bg); color: var(--neon); margin: 0; padding: 0; height: 100vh; overflow: hidden; }

        .page { 
            display: none; 
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 70px; 
            overflow-y: auto; 
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }
        .active-page { display: block; }

        /* CZAT CIASNY */
        #chat-container { display: flex; flex-direction: column; gap: 2px; }
        .msg { border-bottom: 1px solid #111; padding: 2px 0; font-size: 13px; line-height: 1.2; }
        .ts { color: #062; font-size: 9px; margin-right: 4px; }
        .n { font-weight: bold; color: #fff; }

        /* SKANER I USTAW */
        #reader { 
            width: 100%; 
            min-height: 250px; 
            background: #000; 
            border: 2px solid var(--neon); 
            margin-bottom: 15px; 
            border-radius: 12px; 
            overflow: hidden; 
        }
        input { background: #111; border: 1px solid var(--neon); color: var(--neon); padding: 12px; border-radius: 4px; font-size: 16px; width: 100%; margin-bottom: 8px; }
        .btn-act { background: var(--neon); color: #000; border: none; padding: 15px; font-weight: bold; border-radius: 4px; width: 100%; cursor: pointer; }
        .btn-off { background: none; border: 1px solid var(--red); color: var(--red); padding: 10px; border-radius: 4px; width: 100%; margin-top: 15px; }

        /* BLOKADY I UI */
        .locked { filter: grayscale(1); opacity: 0.3; cursor: not-allowed !important; }
        
        .input-bar { 
            position: fixed; bottom: 70px; left: 0; right: 0; 
            background: #000; padding: 10px; display: flex; gap: 5px; 
            border-top: 1px solid #222; z-index: 9998; 
        }
        
        .nav-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            height: 70px; background: #000; display: flex; 
            border-top: 2px solid #333; z-index: 9999; 
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #444; }
        .nav-item.on { color: var(--neon); font-weight: bold; }

        #p-main { text-align: center; padding-top: 20%; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 300px; margin: 0 auto; }
        .btn-m { background: #111; border: 1px solid var(--neon); padding: 25px 10px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="p-main" class="page active-page">
        <h2 style="margin-bottom:5px;">GHOST PRO</h2>
        <div id="lock-status" style="font-size:10px; margin-bottom:30px; color:var(--red);">OFFLINE</div>
        <div class="grid">
            <div id="m-btn-chat" class="btn-m locked" onclick="checkGo('p-chat')">💬<br>CZAT</div>
            <div class="btn-m" onclick="goTo('p-set')">⚙️<br>USTAW</div>
        </div>
    </div>

    <div id="p-set" class="page">
        <div id="reader"></div>
        <input type="password" id="t" placeholder="GitHub Token">
        <input id="r" placeholder="User/Repo">
        <input type="password" id="c" placeholder="Klucz Szyfru">
        <input id="n" placeholder="Twój Nick">
        <button class="btn-act" onclick="init()">POŁĄCZ I ODBLOKUJ</button>
        <button class="btn-off" onclick="logout()">WYLOGUJ (RESET)</button>
    </div>

    <div id="p-chat" class="page">
        <div id="chat-container"></div>
        <div style="height: 100px;"></div> 
    </div>

    <div id="chat-input-zone" class="input-bar" style="display:none;">
        <input id="m" placeholder="Wiadomość..." onkeypress="if(event.key==='Enter') send()">
        <button style="background:var(--neon); border:none; padding:0 15px; font-weight:bold; border-radius:4px;" onclick="send()">OK</button>
    </div>

    <div class="nav-bar">
        <div class="nav-item on" id="n-main" onclick="goTo('p-main')">🏠<br>START</div>
        <div id="n-chat-btn" class="nav-item locked" onclick="checkGo('p-chat')">💬<br>CZAT</div>
        <div class="nav-item" id="n-set" onclick="goTo('p-set')">⚙️<br>USTAW</div>
    </div>

<script>
    let hist = "", sha = "", path = "", qr = null;
    const $ = id => document.getElementById(id);

    function checkGo(id) {
        if(!path) {
            alert("Brak połączenia! Wejdź w USTAW.");
            goTo('p-set');
        } else goTo(id);
    }

    function updateUI() {
        const isReady = (path !== "");
        $('m-btn-chat').classList.toggle('locked', !isReady);
        $('n-chat-btn').classList.toggle('locked', !isReady);
        $('lock-status').innerText = isReady ? "SYSTEM AKTYWNY" : "WYMAGANE POŁĄCZENIE";
        $('lock-status').style.color = isReady ? "var(--neon)" : "var(--red)";
    }

    function goTo(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('on'));
        $(id).classList.add('active-page');
        
        const key = id.split('-')[1];
        if($('n-'+key)) $('n-'+key).classList.add('on');

        $('chat-input-zone').style.display = (id === 'p-chat') ? 'flex' : 'none';
        if(id === 'p-set') setTimeout(startQR, 300); else stopQR();
    }

    function startQR() {
        if(!qr) qr = new Html5Qrcode("reader");
        // Optymalizacja obszaru skanowania
        const qrSize = Math.min(window.innerWidth * 0.7, 200);
        
        qr.start(
            { facingMode: "environment" }, 
            { fps: 20, qrbox: { width: qrSize, height: qrSize } }, 
            (txt) => {
                const d = txt.split('|');
                if(d.length >= 4) {
                    $('t').value = d[0]; $('r').value = d[1]; $('c').value = d[2]; $('n').value = d[3];
                    navigator.vibrate(100);
                    init();
                }
            }
        ).catch(e => console.log("Cam error"));
    }

    async function stopQR() { if(qr && qr.isScanning) { await qr.stop(); } }

    function logout() {
        if(confirm("Zresetować sesję?")) {
            localStorage.clear();
            path = "";
            updateUI();
            location.reload();
        }
    }

    window.onload = () => {
        ['gh_t', 'gh_r', 'gh_n', 'gh_c'].forEach(k => {
            if(localStorage.getItem(k)) $(k.replace('gh_','')).value = localStorage.getItem(k);
        });
        if($('c').value && $('t').value) {
            path = "pokoje/" + CryptoJS.MD5($('c').value).toString().substring(0, 10) + ".txt";
        }
        updateUI();
    };

    async function init() {
        if(!$('c').value || !$('t').value) return alert("Uzupełnij dane!");
        path = "pokoje/" + CryptoJS.MD5($('c').value).toString().substring(0, 10) + ".txt";
        ['t','r','n','c'].forEach(id => localStorage.setItem('gh_'+id, $(id).value));
        updateUI();
        goTo('p-chat');
        setInterval(fetchData, 4000);
        fetchData();
    }

    async function fetchData() {
        if(!path || $('p-chat').style.display === 'none') return;
        try {
            const r = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}?t=${Date.now()}`, {
                headers: {'Authorization': `token ${$('t').value}`}
            });
            if(r.ok) {
                const d = await r.json(); sha = d.sha;
                const dec = CryptoJS.AES.decrypt(atob(d.content), $('c').value).toString(CryptoJS.enc.Utf8);
                if(dec && dec !== hist) {
                    $('chat-container').innerHTML = dec.split('\n').map(l => `<div class="msg">${l}</div>`).join('');
                    $('p-chat').scrollTop = $('p-chat').scrollHeight;
                    hist = dec;
                }
            }
        } catch(e) {}
    }

    async function send() {
        const v = $('m').value.trim(); if(!v || !path) return;
        const entry = `<span class="ts">[${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}]</span> <span class="n">${$('n').value}:</span> ${v}`;
        const full = hist + (hist ? "\n" : "") + entry;
        const enc = btoa(CryptoJS.AES.encrypt(full, $('c').value).toString());
        const r = await fetch(`https://api.github.com/repos/${$('r').value}/contents/${path}`, {
            method: 'PUT',
            headers: {'Authorization': `token ${$('t').value}`},
            body: JSON.stringify({message: "msg", content: enc, sha: sha})
        });
        if(r.ok) { $('m').value = ""; fetchData(); }
    }
</script>
</body>
</html>
